<title>MA Decision Register</title>
<style>:root{color-scheme:light;
--bg:#f2f2f7;--surface:#ffffff;--surface2:#f2f2f7;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);--sepo:#c6c6c8;
--fill:rgba(120,120,128,.2);--fill3:rgba(118,118,128,.12);--fill4:rgba(116,116,128,.08);
--tint:#0088ff;--link:#1e6ef4;--on:#fff;
--blue:#0088ff;--blueA:#1e6ef4;--orange:#ff8d28;--orangeA:#c55300;--indigo:#6155f5;--indigoA:#564ade;--green:#34c759;--greenA:#008932;--gray:#8e8e93;--red:#ff383c;--redA:#e9152d;
--glass:rgba(255,255,255,.7);
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI","Helvetica Neue",sans-serif;
--rounded:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--sepo:#38383a;
--fill:rgba(120,120,128,.36);--fill3:rgba(118,118,128,.24);--fill4:rgba(116,116,128,.18);--tint:#0091ff;--link:#5cb8ff;
--blue:#0091ff;--blueA:#5cb8ff;--orange:#ff9230;--orangeA:#ffa056;--indigo:#6d7cff;--indigoA:#a7aaff;--green:#30d158;--greenA:#4ad968;--red:#ff4245;--redA:#ff6165;--glass:rgba(0,0,0,.7)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--sepo:#38383a;
--fill:rgba(120,120,128,.36);--fill3:rgba(118,118,128,.24);--fill4:rgba(116,116,128,.18);--tint:#0091ff;--link:#5cb8ff;
--blue:#0091ff;--blueA:#5cb8ff;--orange:#ff9230;--orangeA:#ffa056;--indigo:#6d7cff;--indigoA:#a7aaff;--green:#30d158;--greenA:#4ad968;--red:#ff4245;--redA:#ff6165;--glass:rgba(0,0,0,.7)}

*{box-sizing:border-box}
body{margin:0;padding-inline:16px;padding-block:0 60px;background:var(--bg);color:var(--label);font:17px/22px var(--sans);letter-spacing:-.43px;-webkit-font-smoothing:antialiased}
header.top{margin-inline:-16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 18px 10px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-bottom:1px solid var(--sep)}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:17px}
#status{font-size:13px;color:var(--label2)}
#ghBtn{margin-left:auto;font-size:13px}
#warn input{font:15px var(--sans);padding:5px 9px;border-radius:9px;border:1px solid var(--sep);background:var(--surface);color:var(--label)}
.seg{display:inline-flex;background:var(--fill3);border-radius:9px;padding:2px;gap:2px}
.seg button{font:500 13px var(--sans);border:0;background:transparent;color:var(--label);border-radius:7px;padding:5px 11px;cursor:pointer;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--fill3);margin-top:9px}
.bar i{display:block;height:100%;transition:width .3s}
.bar .a{background:var(--green)}.bar .e{background:var(--orange)}.bar .r{background:var(--red)}
.counts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--label2);margin-top:6px;font-variant-numeric:tabular-nums}
.counts b{color:var(--label);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
select,input[type=search]{font:15px var(--sans);color:var(--label);background:var(--surface);border:1px solid var(--sep);border-radius:9px;padding:5px 9px;min-height:32px}
input[type=search]{flex:1;min-width:140px}
main{max-width:980px;margin:0 auto}
.intro{margin:18px 0 6px;color:var(--label2);font-size:15px;line-height:21px;max-width:68ch}
.intro b{color:var(--label)}
h2.topic{font:700 22px/28px var(--sans);letter-spacing:.35px;margin:26px 4px 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.topic .tn{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--label2);font-size:15px;font-weight:500}
h2.topic .tp{font:400 13px var(--sans);color:var(--label2);margin-left:auto}
h2.topic button{font:500 13px var(--sans);color:var(--link);background:none;border:0;cursor:pointer;padding:2px 4px}
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.line{display:grid;grid-template-columns:4.4em 1fr auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--sep);align-items:start}
.line:first-child{border-top:0}
.line[data-s="a"]{box-shadow:inset 3px 0 var(--green)}.line[data-s="e"]{box-shadow:inset 3px 0 var(--orange)}.line[data-s="r"]{box-shadow:inset 3px 0 var(--red)}
.line[data-s="r"] .tx{text-decoration:line-through;color:var(--label2)}
.id{font:500 13px/22px ui-monospace,"SF Mono",Menlo,monospace;color:var(--label2);font-variant-numeric:tabular-nums}
.tx{font-size:16px;line-height:22px}
.lb{display:inline-block;font:600 11px/16px var(--sans);letter-spacing:.3px;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:7px;vertical-align:1px}
.lb.C{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--greenA)}
.lb.P{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blueA)}
.lb.H{background:color-mix(in srgb,var(--indigo) 16%,transparent);color:var(--indigoA)}
.lb.O{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orangeA)}
.lb.D{background:var(--fill3);color:var(--label2)}
.acts{display:flex;gap:4px}
.acts button{font:600 13px var(--sans);border:1px solid var(--sep);background:var(--surface);color:var(--label);border-radius:8px;padding:0 10px;min-height:30px;cursor:pointer}
.acts button:hover{background:var(--fill4)}
.acts button.on[data-v="a"]{background:var(--green);border-color:var(--green);color:#fff}
.acts button.on[data-v="e"]{background:var(--orange);border-color:var(--orange);color:#fff}
.acts button.on[data-v="r"]{background:var(--red);border-color:var(--red);color:#fff}
.more{grid-column:2/4;display:grid;gap:6px}
.more textarea{font:15px/20px var(--sans);color:var(--label);background:var(--fill4);border:1px solid var(--sep);border-radius:9px;padding:7px 10px;width:100%;resize:vertical;min-height:38px}
.more label{font-size:12px;color:var(--label2);letter-spacing:0}
.notebtn{font:13px var(--sans);color:var(--link);background:none;border:0;padding:0;cursor:pointer;justify-self:start}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 45%,transparent);outline-offset:1px}
.confirm{grid-column:1/-1;background:var(--fill4);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.confirm button{font:600 13px var(--sans);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.confirm .yes{background:var(--green);color:#fff}.confirm .no{background:var(--fill3);color:var(--label)}
.empty{padding:30px;text-align:center;color:var(--label2)}
.warnbox{margin:14px 0;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--orange) 14%,transparent);font-size:14px}
@media (max-width:620px){.line{grid-template-columns:3.6em 1fr}.acts{grid-column:1/-1;justify-content:flex-end}.more{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
const D={"topics": {"01": "Founder reality", "02": "Company definition", "03": "Phase skeleton", "04": "Services", "05": "Customers", "06": "Functions and decisions", "07": "Sales", "08": "Leads and pipeline", "09": "Money", "10": "Resourcing", "11": "Legal and admin", "12": "Baraa and Nawaf", "13": "Future branches", "14": "Risk and rhythm", "15": "Phases", "16": "Decision register"}, "labels": {"C": "Confirmed", "P": "Provisional", "H": "Hypothesis", "O": "Open", "D": "Deferred"}, "rows": [{"id": "01.01", "t": "01", "l": "C", "x": "Two founders: Baraa and Nawaf. Freelancers only as a per-job exception (Topic 10)", "n": false}, {"id": "01.02", "t": "01", "l": "C", "x": "Both founders give the same hours, effort and work intensity — 20+ a week each; both dip at exam and work peaks", "n": false}, {"id": "01.03", "t": "01", "l": "C", "x": "Nawaf is a fully operating founder — technical and operating work, business discussions, a voice in most matters; not only a source of leads", "n": false}, {"id": "01.04", "t": "01", "l": "C", "x": "Baraa leads design for the time being; Nawaf supports it", "n": false}, {"id": "01.05", "t": "01", "l": "C", "x": "Skills: Baraa — design, editing and motion, Arabic and English writing, software and AI · Nawaf — selling, networking, leads and existing contacts, brainstorming, building the base, plus technical and operating work", "n": false}, {"id": "01.06", "t": "01", "l": "C", "x": "Both founders speak Arabic and English; only Baraa writes content", "n": false}, {"id": "01.07", "t": "01", "l": "C", "x": "Management is shared by both founders from the start", "n": false}, {"id": "01.08", "t": "01", "l": "C", "x": "Nothing exists today: no entity, licence, bank account, portfolio, name or domain; everything is set up new", "n": false}, {"id": "01.09", "t": "01", "l": "P", "x": "Seed of SAR 10–20k, meant to last 3–6 months", "n": false}, {"id": "01.10", "t": "01", "l": "C", "x": "Both founders put in the same amount of cash", "n": false}, {"id": "01.11", "t": "01", "l": "C", "x": "Only the seed is at risk; a top-up only if money runs out while working on paid projects, never to cover losses with no project", "n": false}, {"id": "01.12", "t": "01", "l": "P", "x": "The third party may cover Baraa's share of the seed; anything he receives comes out of Baraa's block by private agreement; the company sees two founders; Nawaf is told", "n": false}, {"id": "02.01", "t": "02", "l": "C", "x": "The company designs for events, makes content around them when needed, and hands over a four-part guideline", "n": false}, {"id": "02.02", "t": "02", "l": "C", "x": "Event design covers identity, printed items (designed, not produced), digital assets, event content and the digital layer inside structures", "n": false}, {"id": "02.03", "t": "02", "l": "C", "x": "Event design is one service line, not the whole company", "n": false}, {"id": "02.04", "t": "02", "l": "C", "x": "The guideline is a service item; which parts are delivered depends on the package and the agreement", "n": false}, {"id": "02.05", "t": "02", "l": "C", "x": "Never a general IT or software house; tech services only for existing clients (Topic 15)", "n": false}, {"id": "02.06", "t": "02", "l": "C", "x": "Never event logistics or event management", "n": false}, {"id": "02.07", "t": "02", "l": "C", "x": "We never fund a client's campaign and never hold a client's ad accounts; we make the assets and the client launches", "n": false}, {"id": "02.08", "t": "02", "l": "C", "x": "Known for reliability, quality and understanding the Gulf market", "n": false}, {"id": "02.09", "t": "02", "l": "C", "x": "Purpose: better events here · something of our own · a platform for bigger things", "n": false}, {"id": "02.10", "t": "02", "l": "C", "x": "Customers: companies and government / semi-government pursued equally; universities if they come; agencies when the chance appears", "n": false}, {"id": "02.11", "t": "02", "l": "P", "x": "Positioning: \"an agency that handles the full digital workload\" — for the time being", "n": false}, {"id": "02.12", "t": "02", "l": "P", "x": "Wider direction: plans for anything in marketing, advertising and sales; events remain the way in", "n": false}, {"id": "02.13", "t": "02", "l": "H", "x": "The guideline is what turns a one-off event into a returning client — untested", "n": false}, {"id": "02.14", "t": "02", "l": "O", "x": "The company name and identity", "n": false}, {"id": "02.15", "t": "02", "l": "O", "x": "How the guideline packages are cut", "n": false}, {"id": "03.01", "t": "03", "l": "C", "x": "A phase exists because something becomes possible once its gates are met", "n": false}, {"id": "03.02", "t": "03", "l": "C", "x": "Phases end on results, never on a date", "n": false}, {"id": "03.03", "t": "03", "l": "C", "x": "Gates come from the fixed restriction list: money, revenue level, clients, capability, skills, hours, partner, licence, place and the rest (Topic 15)", "n": false}, {"id": "03.04", "t": "03", "l": "C", "x": "A pivot may change the service, the customer, or the price and package; the sales method is a tactic", "n": false}, {"id": "03.05", "t": "03", "l": "C", "x": "Effort is measured four ways: hours, attempts, money, client satisfaction", "n": false}, {"id": "03.06", "t": "03", "l": "C", "x": "\"Ready to sell\" = identity, price list and service description, entity and invoicing", "n": false}, {"id": "03.07", "t": "03", "l": "C", "x": "P2's job is the first sale; profit is not required", "n": false}, {"id": "03.08", "t": "03", "l": "C", "x": "The company is in P0 today", "n": false}, {"id": "03.09", "t": "03", "l": "C", "x": "Roles and the split between the founders are reviewed at the end of each band", "n": false}, {"id": "04.01", "t": "04", "l": "C", "x": "Offer structure: services → item groups → items; clients buy packages of services", "n": false}, {"id": "04.02", "t": "04", "l": "C", "x": "Every item belongs to a service and is sold inside a package — nothing loose", "n": false}, {"id": "04.03", "t": "04", "l": "C", "x": "Packages are built from a priced item list; versions of a package differ by item count", "n": false}, {"id": "04.04", "t": "04", "l": "C", "x": "The client leads with what he wants; we propose it in our order and style", "n": false}, {"id": "04.05", "t": "04", "l": "C", "x": "A separate price list exists and must be finished before P1 ends", "n": false}, {"id": "04.06", "t": "04", "l": "C", "x": "Every card has a place on the phase map; proposals and pitch decks are not a separate service (Topic 15)", "n": false}, {"id": "04.07", "t": "04", "l": "P", "x": "The four service names and their grouping — working version", "n": false}, {"id": "04.08", "t": "04", "l": "P", "x": "The example packages and counts — illustrative only", "n": false}, {"id": "04.09", "t": "04", "l": "H", "x": "The P2 services fit inside the founders' hours at a sellable pace — untested", "n": false}, {"id": "04.10", "t": "04", "l": "O", "x": "Which other services exist", "n": false}, {"id": "04.11", "t": "04", "l": "O", "x": "What the operational playbook in the guideline is: a written document, a template the client fills, or a working session", "n": false}, {"id": "04.12", "t": "04", "l": "O", "x": "Whether a separate \"services and items\" topic is needed", "n": false}, {"id": "05.01", "t": "05", "l": "C", "x": "P2 customers: companies and government pursued equally; universities accepted if they come; agencies when the chance appears", "n": false}, {"id": "05.02", "t": "05", "l": "C", "x": "Until the first sale, reach is Nawaf's network only; a silent network means P2's pivot", "n": false}, {"id": "05.03", "t": "05", "l": "C", "x": "Lead qualification: a contact who can approve, the event date and a basic brief, readiness to pay half", "n": false}, {"id": "05.04", "t": "05", "l": "C", "x": "Payment: half the invoice before work starts, the rest on completed work", "n": false}, {"id": "05.05", "t": "05", "l": "C", "x": "In P2, anything that was not supposed to happen counts as failure; the pivot is built at that time", "n": false}, {"id": "05.06", "t": "05", "l": "C", "x": "We refuse logistics and production requests, and any fake engagement or deception; no sector or size is off-limits", "n": false}, {"id": "05.07", "t": "05", "l": "C", "x": "A client with no material or logo is welcome — we suggest other plans", "n": false}, {"id": "05.08", "t": "05", "l": "C", "x": "Later customer types: retainer clients (P8), individual creators (P9), agencies on spare capacity", "n": false}, {"id": "05.09", "t": "05", "l": "P", "x": "A signed agreement replaces the half-payment in a later phase with capital", "n": false}, {"id": "05.10", "t": "05", "l": "H", "x": "The network holds at least one event owner ready to buy in P2 — untested", "n": false}, {"id": "05.11", "t": "05", "l": "O", "x": "The government route: direct award, subcontract or tender", "n": false}, {"id": "05.12", "t": "05", "l": "O", "x": "Which phase moves from the half-payment to a signed agreement", "n": false}, {"id": "05.13", "t": "05", "l": "D", "x": "Which phase opens agencies on spare capacity", "n": false}, {"id": "05.14", "t": "05", "l": "O", "x": "How the test-phase companies are selected, and how many", "n": false}, {"id": "06.01", "t": "06", "l": "C", "x": "Functions: production — both founders, Baraa leads design · sales and the client relationship — both, Nawaf brings the leads · money and admin — Baraa", "n": false}, {"id": "06.02", "t": "06", "l": "C", "x": "One founder alone: production choices inside a job · spending under SAR 800", "n": false}, {"id": "06.03", "t": "06", "l": "C", "x": "Both founders: accept or refuse a client · the final price · spending at or above SAR 800 and any new commitment · changing what the company is", "n": false}, {"id": "06.04", "t": "06", "l": "C", "x": "A disagreement is decided by whoever holds that function; no tie-break by hours, no third person", "n": false}, {"id": "06.05", "t": "06", "l": "C", "x": "Nawaf runs lead qualification; both founders decide", "n": false}, {"id": "06.06", "t": "06", "l": "C", "x": "No separate quality check, in any phase — the producer checks his own work", "n": false}, {"id": "06.07", "t": "06", "l": "P", "x": "When the two disagree on design, Baraa decides — he leads design", "n": false}, {"id": "06.08", "t": "06", "l": "C", "x": "Later functions: a production lead when designers are hired · client-getting methods as each opens", "n": false}, {"id": "06.09", "t": "06", "l": "P", "x": "Proposals: Baraa drafts, Nawaf presents", "n": false}, {"id": "06.10", "t": "06", "l": "O", "x": "Who answers to the client when work goes out wrong — decided at the first job", "n": false}, {"id": "06.11", "t": "06", "l": "O", "x": "What happens when a \"both\" decision is stuck", "n": false}, {"id": "06.12", "t": "06", "l": "D", "x": "Which phase brings each later function", "n": false}, {"id": "07.01", "t": "07", "l": "C", "x": "Routes in order: list-led first, then opportunity-led, maybe request-led", "n": false}, {"id": "07.02", "t": "07", "l": "C", "x": "Referrals from the network are part of the list-led route", "n": false}, {"id": "07.03", "t": "07", "l": "C", "x": "P2 stays client-led: the client states the need and we reorder it into our services", "n": false}, {"id": "07.04", "t": "07", "l": "C", "x": "The first conversation produces: the need in their words, lead-qualification items, a budget range, a proposal date", "n": false}, {"id": "07.05", "t": "07", "l": "C", "x": "Closed = a written yes, then half paid; the half-payment is the sale", "n": false}, {"id": "07.06", "t": "07", "l": "C", "x": "Outreach to strangers (messaging, calls, visits) may start any time after the first sale", "n": false}, {"id": "07.07", "t": "07", "l": "C", "x": "An offer is judged only after 500 prospects", "n": false}, {"id": "07.08", "t": "07", "l": "P", "x": "The ten-step first-customer plan", "n": false}, {"id": "07.09", "t": "07", "l": "H" }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function counts(){
 const rs=rowsFor();let a=0,e=0,r=0;rs.forEach(x=>{const s=L(x.id).s;if(s==='a')a++;else if(s==='e')e++;else if(s==='r')r++;});
 const n=rs.length,left=n-a-e-r;
 const bs=document.querySelectorAll('.bar i');bs[0].style.width=a/n*100+'%';bs[1].style.width=e/n*100+'%';bs[2].style.width=r/n*100+'%';
 $('#counts').innerHTML=`<span><b>${a+e+r}</b> of ${n} answered</span><span><i class="dot" style="background:var(--green)"></i>Accepted <b>${a}</b></span><span><i class="dot" style="background:var(--orange)"></i>Edited <b>${e}</b></span><span><i class="dot" style="background:var(--red)"></i>Rejected <b>${r}</b></span><span>Left <b>${left}</b></span>`;
}
function render(){
 $('#tabMain').setAttribute('aria-pressed',tab==='main');$('#tabNaw').setAttribute('aria-pressed',tab==='naw');
 $('#whoB').setAttribute('aria-pressed',who==='baraa');$('#whoN').setAttribute('aria-pressed',who==='nawaf');
 $('#intro').innerHTML=tab==='main'
  ?`Every labelled decision from Topics 01–15, latest wording only — updated after the founders' meeting of 24 Sep. For each line choose <b>Accept</b>, <b>Edit</b> (write how it should read) or <b>Reject</b>, and add a note if you want. IDs match the Topic 16 PDF. Answers save as you go.`
  :`Lines about Nawaf's time, his job or both founders' shares. Baraa's answers are written in; they stay Provisional or Open until Nawaf gives his own. Switch to <b>Nawaf reviewing</b> so his answers are kept apart from Baraa's.`;
 counts();
 const act=document.activeElement, actId=act&&act.id, selS=act&&act.selectionStart, selE=act&&act.selectionEnd;
 const rs=rowsFor().filter(passes);
 if(!rs.length){$('#list').innerHTML='<div class="empty">No lines match these filters.</div>';return}
 const by={};rs.forEach(r=>(by[r.t]=by[r.t]||[]).push(r));
 let h='';
 for(const t of Object.keys(by).sort()){
  const all=rowsFor().filter(r=>r.t===t),done=all.filter(r=>L(r.id).s).length,leftN=all.length-done;
  h+=`<h2 class="topic"><span class="tn">${t}</span>${esc(D.topics[t])}<span class="tp">${done} of ${all.length} answered</span>${leftN?`<button data-bulk="${t}">Accept the ${leftN} left</button>`:''}</h2>`;
  if(pendingBulk===t)h+=`<div class="confirm">Accept all ${leftN} unanswered lines in Topic ${t}? Lines you already answered stay as they are. <button class="yes" data-bulkyes="${t}">Accept ${leftN}</button><button class="no" data-bulkno>Cancel</button></div>`;
  h+='<div class="group">';
  for(const r of by[t]){
   const s=L(r.id),hasNote=(s.note||'').trim()||openNotes.has(r.id);
   h+=`<div class="line" data-id="${r.id}" data-s="${s.s||''}"><span class="id">${r.id}</span><div class="tx"><span class="lb ${r.l}">${LN[r.l]}</span>${esc(r.x)}</div>
   <div class="acts" role="group" aria-label="Answer for ${r.id}">${[['a','Accept'],['e','Edit'],['r','Reject']].map(([v,n])=>`<button data-v="${v}" class="${s.s===v?'on':''}" aria-pressed="${s.s===v}">${n}</button>`).join('')}</div>
   <div class="more">${s.s==='e'?`<label for="ed-${r.id}">How the line should read</label><textarea id="ed-${r.id}" data-f="edit" rows="2">${esc(s.edit!=null?s.edit:r.x)}</textarea>`:''}
   ${hasNote?`<label for="nt-${r.id}">Note</label><textarea id="nt-${r.id}" data-f="note" rows="1" placeholder="A question, a reason, check with Nawaf…">${esc(s.note||'')}</textarea>`:`<button class="notebtn" data-addnote>+ Add a note</button>`}</div></div>`;
  }
  h+='</div>';
 }
 $('#list').innerHTML=h;
 if(actId){const el=document.getElementById(actId);if(el){el.focus();try{el.setSelectionRange(selS,selE)}catch(e){}}}
}
// saving
let q=Promise.resolve(), timers={};
function setStatus(t){$('#status').textContent=t}
function save(id,patch){
 const w=who; state[w][id]=Object.assign({},state[w][id],patch);
 if(!docs[w]){setStatus('Not saved — storage unavailable');return}
 setStatus('Saving…');
 q=q.then(()=>docs[w].update({lines:{[id]:Object.assign({},state[w][id],{at:new Date().toISOString()})}})).then(()=>setStatus('Saved')).catch(e=>{setStatus('Not saved — '+(e&&e.code==='no_token'?'connect GitHub to save':e&&e.code==='not_granted'?'this token cannot write to the repo':'try again'));});
}
$('#list').addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.bulk){pendingBulk=b.dataset.bulk;render();return}
 if(b.hasAttribute('data-bulkno')){pendingBulk=null;render();return}
 if(b.dataset.bulkyes){const t=b.dataset.bulkyes;pendingBulk=null;const ids=rowsFor().filter(r=>r.t===t&&!L(r.id).s).map(r=>r.id);
   ids.forEach(id=>state[who][id]=Object.assign({},state[who][id],{s:'a'}));
   if(docs[who]){setStatus('Saving…');const at=new Date().toISOString();const lines={};ids.forEach(id=>lines[id]=Object.assign({},state[who][id],{at}));q=q.then(()=>docs[who].update({lines})).then(()=>setStatus('Saved')).catch(e=>setStatus('Not saved — '+(e&&e.code==='no_token'?'connect GitHub to save':'try again')))}
   render();return}
 const line=b.closest('.line');if(!line)return;const id=line.dataset.id;
 if(b.hasAttribute('data-addnote')){openNotes.add(id);render();const t=document.getElementById('nt-'+id);t&&t.focus();return}
 const v=b.dataset.v;if(!v)return;
 const cur=L(id).s; const nv=cur===v?null:v;
 const patch={s:nv}; if(nv==='e'&&L(id).edit==null){const r=D.rows.find(x=>x.id===id);patch.edit=r.x}
 save(id,patch);render();
 if(nv==='e'){const t=document.getElementById('ed-'+id);if(t){t.focus();t.select()}}
});
$('#list').addEventListener('input',ev=>{
 const ta=ev.target;if(ta.tagName!=='TEXTAREA')return;const id=ta.closest('.line').dataset.id,f=ta.dataset.f;
 state[who][id]=Object.assign({},state[who][id],{[f]:ta.value});setStatus('Typing…');
 clearTimeout(timers[id+f]);timers[id+f]=setTimeout(()=>save(id,{[f]:ta.value}),600);
});
$('#list').addEventListener('focusout',ev=>{const ta=ev.target;if(ta.tagName!=='TEXTAREA')return;const id=ta.closest('.line').dataset.id,f=ta.dataset.f;if(timers[id+f]){clearTimeout(timers[id+f]);delete timers[id+f];save(id,{[f]:ta.value})}});
render();
// GitHub storage: answers live in data/baraa.json and data/nawaf.json in this repo
const GH={owner:'Baraakhaldi',repo:'MA-Decision-Register',branch:'main'};
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}`;
let token=null;try{token=localStorage.getItem('dr-gh-token')}catch(e){}
const enc=s=>{const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const hdr=()=>Object.assign({Accept:'application/vnd.github+json'},token?{Authorization:'Bearer '+token}:{});
async function ghGet(w){
 const r=await fetch(`${API}/contents/data/${w}.json?ref=${GH.branch}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
 if(r.status===404)return{lines:{},sha:null};
 if(!r.ok)throw{code:'http',status:r.status};
 const j=await r.json();let lines={};try{lines=JSON.parse(dec(j.content)).lines||{}}catch(e){}
 return{lines,sha:j.sha};
}
function mkDoc(w){
 const d={pending:{},timer:null,waiters:[]};
 try{d.pending=JSON.parse(localStorage.getItem('dr-pending-'+w)||'{}')}catch(e){}
 const keep=()=>{try{localStorage.setItem('dr-pending-'+w,JSON.stringify(d.pending))}catch(e){}};
 d.flush=async()=>{
  if(!Object.keys(d.pending).length)return;
  if(!token)throw{code:'no_token'};
  for(let i=0;i<4;i++){
   const cur=await ghGet(w);const snap=Object.assign({},d.pending);
   const lines=Object.assign({},cur.lines,snap);
   const body={message:`${w}: ${Object.keys(snap).length} answer(s)`,branch:GH.branch,content:enc(JSON.stringify({lines},null,1))};
   if(cur.sha)body.sha=cur.sha;
   const r=await fetch(`${API}/contents/data/${w}.json`,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)});
   if(r.ok){for(const k of Object.keys(snap))if(d.pending[k]===snap[k])delete d.pending[k];keep();return}
   if(r.status===401||r.status===403||r.status===404)throw{code:'not_granted'};
   if(r.status!==409&&r.status!==422)throw{code:'http',status:r.status};
  }
  throw{code:'conflict'};
 };
 d.update=({lines})=>{
  Object.assign(d.pending,lines);keep();
  return new Promise((res,rej)=>{d.waiters.push([res,rej]);clearTimeout(d.timer);
   d.timer=setTimeout(()=>{const ws=d.waiters;d.waiters=[];d.flush().then(()=>ws.forEach(x=>x[0]()),e=>ws.forEach(x=>x[1](e)))},1200)});
 };
 return d;
}
async function pull(){
 for(const w of ['baraa','nawaf']){
  try{const {lines}=await ghGet(w);
   const a=document.activeElement;const editing=a&&a.tagName==='TEXTAREA'&&a.closest('.line');
   const next=Object.assign({},lines,docs[w].pending);
   for(const[id,v] of Object.entries(next)){if(editing&&editing.dataset.id===id&&w===who)continue;state[w][id]=v}
  }catch(e){}
 }
 const a=document.activeElement;if(!(a&&a.tagName==='TEXTAREA'))render();else counts();
}
function showConnect(){
 const box=$('#warn');box.hidden=false;
 box.innerHTML=token
  ?`Connected to GitHub. Answers save to <b>data/${who}.json</b> in the repo. <button id="ghOut" class="notebtn">Disconnect this browser</button>`
  :`<b>To save answers, connect GitHub once in this browser.</b> Anyone can view this page; only people with write access to the repo can save.<br>
   Create a token at <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com → Settings → Developer settings → Personal access tokens</a>.
   Repo owner: a fine-grained token for only this repository, with <i>Contents: Read and write</i>. Collaborator (Nawaf): a classic token with the <i>public_repo</i> scope.
   The token stays in this browser only.<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input type="password" id="ghTok" placeholder="Paste token" style="flex:1;min-width:180px"><button id="ghSave" class="notebtn" style="font-weight:600">Connect</button></div>`;
 const o=$('#ghOut');if(o)o.onclick=()=>{token=null;try{localStorage.removeItem('dr-gh-token')}catch(e){};updConn();showConnect()};
 const sv=$('#ghSave');if(sv)sv.onclick=async()=>{
  const t=$('#ghTok').value.trim();if(!t)return;setStatus('Checking token…');
  try{const r=await fetch(API,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t}});const j=r.ok?await r.json():null;
   if(!j||!(j.permissions&&j.permissions.push)){setStatus('That token cannot write to this repo');return}
   token=t;try{localStorage.setItem('dr-gh-token',t)}catch(e){}
   updConn();box.hidden=true;setStatus('Saving…');
   for(const w of ['baraa','nawaf'])await docs[w].flush().catch(()=>{});
   await pull();setStatus('Saved');setInterval(pull,45000);
  }catch(e){setStatus('Could not check token — try again')}};
}
function updConn(){$('#ghBtn').textContent=token?'GitHub ✓':'Connect GitHub to save'}
(async()=>{
 for(const w of ['baraa','nawaf'])docs[w]=mkDoc(w);
 const btn=document.createElement('button');btn.id='ghBtn';btn.className='notebtn';
 btn.onclick=()=>{const b=$('#warn');if(!b.hidden&&b.querySelector('#ghTok,#ghOut'))b.hidden=true;else showConnect()};
 $('#status').before(btn);updConn();
 await pull();
 setStatus(token?'Saved':'View only');
 if(token){for(const w of ['baraa','nawaf'])docs[w].flush().catch(()=>{});setInterval(pull,45000)}
})();
</script>
